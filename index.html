:root{--bg:#f4f6fb;--card:#fff;--tx:#14213d;--mu:#5b6478;--pr:#3b5bdb;--ok:#d3f9d8;--okb:#2f9e44;--no:#ffe3e3;--nob:#e03131;--fl:#fff3bf;--flb:#f08c00;--bd:#d9deea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}

main{max-width:720px;margin:0 auto;padding:14px}.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#3b5bdb,#9c36b5);transition:width .3s}
.meta{display:flex;justify-content:space-between;margin:10px 2px;color:var(--mu);font-size:13px}.tag{background:var(--fl);color:var(--tx);padding:1px 10px;border-radius:9px}

.opt:hover:not(:disabled){border-color:var(--pr)}.opt.ok{background:var(--ok);border-color:var(--okb)}.opt.no{background:var(--no);border-color:var(--nob)}.opt:disabled{cursor:default}

.row{display:flex;gap:10px;justify-content:space-between;margin-top:12px;flex-wrap:wrap}button.pri,button.ghost{padding:10px 16px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;border:2px solid var(--pr)}

</style></head><body><header><h1>🧬 Biology Quiz</h1><p>Scenario MCQs · Lectures 1–12</p></header><main id="app"></main><script>
const ALL=[
{t:"L3 · Osmosis",q:"A patient is mistakenly given a very concentrated saline solution IV. A blood smear shows shrunken red cells with spiky edges. What is the solution relative to the cells, and what happened?",o:["Hypotonic; water entered the cells","Hypertonic; water left the cells","Isotonic; solutes entered the cells","Hypertonic; water entered the cells"],a:1,e:"More solute outside → water moves out by osmosis → cells shrink (crenate).",w:["Hypotonic solution would make cells swell.","","Isotonic keeps volume stable; no shrinking.","In a hypertonic solution water leaves, it doesn’t enter."]},
{t:"L3 · Na⁺/K⁺ pump",q:"During a stroke, a neuron’s ATP supply collapses. What happens to its sodium-potassium pump and the cell?",o:["Pump keeps working using passive gradients","Na⁺ builds up inside, water follows, and the cell swells","K⁺ leaves faster, so the cell shrinks","The pump becomes facilitated diffusion"],a:1,e:"The pump uses ATP to export Na⁺ and import K⁺. Without ATP, Na⁺ accumulates, water follows by osmosis, and cell-volume control is lost.",w:["It is active transport and needs ATP.","","Loss of ATP leads to Na⁺ accumulation and swelling.","A pump can’t switch to passive transport."]},
{t:"L3 · Transport types",q:"A cell takes up O₂, releases CO₂, imports glucose via a carrier down its gradient, and exports Na⁺ against its gradient. Which step needs ATP?",o:["O₂ uptake","CO₂ release","Glucose import","Na⁺ export"],a:3,e:"Moving against a gradient = active transport, which uses ATP. The others are passive.",w:["Small lipid-soluble: simple diffusion.","Also simple diffusion.","Facilitated diffusion is passive.",""]},
{t:"L3 · Facilitated diffusion",q:"Glucose uptake rises as extracellular glucose rises, then plateaus even at very high concentrations. Best explanation?",o:["Glucose enters by simple diffusion","Carrier proteins became saturated","The Na⁺/K⁺ pump ran out of ATP","Glucose enters by phagocytosis"],a:1,e:"Carriers have limited binding sites; when all are occupied the rate cannot rise further (saturation).",w:["Simple diffusion keeps rising with no plateau.","","Unrelated to the glucose plateau.","Phagocytosis engulfs large particles."]},
{t:"L3 · Endocytosis",q:"A cell takes up one specific molecule only after it binds membrane receptors, forming coated pits. This is:",o:["Phagocytosis","Pinocytosis","Receptor-mediated endocytosis","Exocytosis"],a:2,e:"Binding to specific receptors, then vesicle formation = receptor-mediated endocytosis.",w:["Engulfs large particles; not receptor-specific.","Non-specific intake of extracellular fluid.","","Exocytosis moves material out of the cell."]},
{t:"L3 · Lysosomes",q:"A neutrophil engulfs a bacterium into a vesicle. Which organelle fuses with it to digest the microbe?",o:["Smooth ER","Golgi apparatus","Lysosome","Nucleolus"],a:2,e:"Lysosomes contain hydrolytic enzymes that digest macromolecules, microbes and damaged components.",w:["Makes lipids, detoxifies, stores Ca²⁺.","Modifies, sorts and packages; doesn’t digest.","","Produces ribosome subunits."]},
{t:"L3 · Protein pathway",q:"A pancreatic cell secretes a protein. Which route is correct?",o:["Golgi → rough ER → lysosome → exit","Rough ER → transport vesicle → Golgi → secretory vesicle → exocytosis","Smooth ER → nucleus → plasma membrane","Free ribosome → lysosome → exocytosis"],a:1,e:"Ribosomes on rough ER make it; a vesicle carries it to the Golgi (modify, sort, package); a secretory vesicle fuses with the membrane (exocytosis).",w:["The ER comes before the Golgi.","","Smooth ER makes lipids; proteins don’t route via the nucleus.","Free-ribosome proteins mostly stay in the cytosol."]},
{t:"L3 · Prokaryote vs eukaryote",q:"A patient has a bacterial infection. Compared with human cells, which feature do the bacteria lack?",o:["Ribosomes","DNA","A membrane-bound nucleus","A plasma membrane"],a:2,e:"Both share plasma membrane, cytoplasm, DNA and ribosomes. Prokaryotes lack a membrane-bound nucleus and organelles.",w:["Shared by both.","Shared by both.","","Shared by both."]},
{t:"L4 · Microtubules",q:"A toxin disrupts the tracks used by motor proteins in a long motor neuron, and vesicles stop reaching the axon terminal. Which component is affected?",o:["Intermediate filaments","Actin filaments","Microtubules","Nuclear pores"],a:2,e:"Microtubules are the tracks for motor-protein transport of vesicles and organelles, especially important in long cells like neurons.",w:["They give mechanical strength.","They drive shape change, movement and microvilli support.","","They control nuclear exchange, not axonal transport."]},
{t:"L4 · Cell division",q:"A chemotherapy drug prevents tubulin assembly. Dividing cells arrest because:",o:["The contractile ring cannot form","Chromosomes cannot be aligned and separated by the spindle","Microvilli collapse","The nuclear envelope becomes permeable"],a:1,e:"The mitotic spindle is made of microtubules (tubulin); it positions and separates duplicated chromosomes.",w:["The contractile ring is actin.","","Microvilli are actin-supported.","Not a tubulin function."]},
{t:"L4 · Actin",q:"A toxin depolymerizes actin in intestinal absorptive cells. What is most directly impaired?",o:["Microvilli structure and absorptive surface area","Chromosome separation","Beating of cilia","Stable positioning of the nucleus"],a:0,e:"Each microvillus has a central actin bundle; microvilli increase surface area without much volume.",w:["","Chromosome separation uses microtubules.","Cilia are microtubule-based.","That is an intermediate-filament job."]},
{t:"L4 · Intermediate filaments",q:"A child’s skin blisters with minimal friction because cells can’t withstand mechanical stress. Which cytoskeletal component is most likely defective?",o:["Microtubules","Intermediate filaments","Actin filaments","Tubulin spindle"],a:1,e:"Intermediate filaments are stable and strengthen cells against mechanical stress; they also help hold the nucleus in place.",w:["Transport and chromosome movement.","","Rapid shape change and movement.","Spindle is for division."]},
{t:"L4 · Cilia & flagella",q:"A man has recurrent respiratory infections from poor mucus clearance and is infertile from immotile sperm. Both problems share a defect in:",o:["Actin-based microvilli","Intermediate filaments","The microtubule framework of cilia and flagella","Rough ER"],a:2,e:"Respiratory cilia and sperm flagella both rely on an internal microtubule framework for movement.",w:["Microvilli don’t move materials.","They give strength, not motility.","","Not relevant to motility."]},
{t:"L7 · Interpreting evidence",q:"A 56-year-old with type 2 diabetes has joint discomfort with heavy loads and asks if lighter exercise can still improve the cell’s energy system. Best answer?",o:["Low-load blood-flow-restriction training raised mitochondrial OXPHOS capacity in adults with T2D, but that doesn’t prove 52% more ATP or that it’s best for everyone","Lighter exercise cannot affect mitochondria","BFR training gives you 52% more ATP","Urolithin A proved low-load training works"],a:0,e:"Trinks et al.: CI OXPHOS +52%, CI+II +58% with low-load BFRT. A change in ex vivo respiratory capacity is not a direct change in whole-body ATP.",w:["","The study showed the opposite.","Overclaim: capacity ≠ ATP production in vivo.","Wrong study, and a supplement, not exercise."]},
{t:"L7 · Urolithin A",q:"Trained runners took urolithin A for 4 weeks and proteomics shifted toward mitochondrial pathways. Which statement is best supported?",o:["It increased ATP synthesis","It improved 3000 m performance","Proteomic changes occurred without a clear increase in mitochondrial respiration","Eating pomegranate gives the same effect"],a:2,e:"Whitfield: biomarker change ≠ functional improvement. Respiration and 3000 m time did not clearly improve.",w:["ATP production was not shown.","No significant improvement in time trial.","","Not tested; supplement ≠ whole food."]},
{t:"L7 · NIRS",q:"After 6 weeks of 10-RM or 20-RM training, the NIRS recovery time constant fell 18.9% and 29.1% (p = 0.356 between groups). Interpretation?",o:["20-RM is significantly better","Both improved oxidative capacity, with no significant difference","Both reduced mitochondrial content","A lower time constant means lower ATP production"],a:1,e:"Shorter time constant = faster recovery of muscle O₂ metabolism = better oxidative capacity. p > 0.05, so no significant difference. NIRS is indirect.",w:["p = 0.356 is not significant.","","Direction misread; and content wasn’t measured.","Lower = better oxidative recovery."]},
{t:"L7 · OXPHOS",q:"A poison blocks electron transfer to oxygen at the end of the electron transport chain. ATP production collapses because:",o:["Glycolysis can no longer occur","The proton gradient is not established, so ATP synthase can’t work","Oxygen is stored as ATP","Acetyl-CoA can’t be made"],a:1,e:"O₂ is the final electron acceptor. If electron flow stops, H⁺ isn’t pumped, so ATP synthase has no gradient to use.",w:["Glycolysis is cytosolic and doesn’t need O₂.","","O₂ is not stored as ATP.","Not the direct effect of blocked electron flow."]},
{t:"L7 · Content vs ATP",q:"After training, a researcher finds higher citrate synthase activity in muscle. The most accurate conclusion?",o:["Greater mitochondrial content (a proxy); ATP production in daily life is not proven","Mitochondria now make more ATP at rest","Performance has improved","Mitochondrial respiration rose by the same percent"],a:0,e:"Citrate synthase is a proxy for mitochondrial content. Content, respiration, capacity and ATP production are not interchangeable.",w:["","Not shown by this marker.","Performance wasn’t measured.","Respiration needs separate measurement (respirometry)."]},
{t:"L9 · Body membranes",q:"A teenager has fever, headache and stiff neck; bacterial infection (e.g., N. meningitidis) is suspected. Which membranes are inflamed?",o:["Peritoneum","Meninges","Synovial membrane","Mucous membrane"],a:1,e:"Meninges: connective tissue inside the dorsal cavity that protects the brain and spinal cord.",w:["Lines the abdominal cavity.","","Lines freely movable joints.","Lines tubes opening to the outside."]},
{t:"L9 · Negative feedback",q:"A hiker in desert heat: skin vessels dilate and sweating increases. Why is this negative feedback?",o:["The response amplifies the temperature rise","The response reverses the stimulus, returning temperature toward its set point","It occurs only in time-limited events with a cutoff","It prevents all temperature fluctuation"],a:1,e:"Sensor → control center → effector that opposes the original change. Heat loss brings temperature back toward normal.",w:["That describes positive feedback.","","That describes positive feedback (e.g., childbirth).","Values fluctuate around the set point; they aren’t eliminated."]},
{t:"L9 · Positive feedback",q:"During labor, contractions intensify until the baby is delivered. Why is this positive feedback?",o:["It corrects a deviation back to a set point","It amplifies the change in the same direction until a cutoff ends the process","It maintains blood glucose","It is the body’s primary homeostatic mechanism"],a:1,e:"Positive feedback pushes the stimulus further in the same direction and is limited to specific events (childbirth, clotting, protein digestion in the stomach).",w:["That is negative feedback.","","Glucose is regulated by negative feedback.","Negative feedback is the primary mechanism."]},
{t:"L9 · Blood glucose",q:"A patient’s pancreas fails to make insulin. Why is blood glucose high while cells are starved?",o:["Glucose can’t enter cells and stays in the blood, so cells burn fats/proteins","The liver stores too much glycogen","The kidneys make extra glucose","The lungs fail to excrete glucose"],a:0,e:"Insulin lets cells take up glucose and the liver store it as glycogen. Without it, glucose stays in blood and cells burn fats/proteins (diabetes mellitus).",w:["","Insulin promotes glycogen storage; lack of it does the opposite.","Not the mechanism described.","Lungs excrete CO₂, not glucose."]},
{t:"L3 · SA:V ratio",q:"A cell doubles its diameter. What happens to its ability to exchange nutrients and wastes?",o:["Exchange improves because surface area rises","Exchange becomes less efficient because surface area-to-volume ratio falls","Nothing changes; the ratio is constant","Exchange improves because volume rises faster"],a:1,e:"Volume grows faster than surface area, so SA:V falls. Smaller cells keep a higher ratio and more efficient exchange (1.5:1 vs 6:1 in the cube figure).",w:["Surface area rises, but volume rises much more.","","The ratio changes with size.","More volume means more need but relatively less membrane."]},
{t:"L3 · Membrane structure",q:"Immune cells fail to recognize a transplanted tissue’s cells as “self” because of a defect in membrane markers. Which membrane component is most involved in cell recognition?",o:["Cholesterol","Phospholipid tails","Carbohydrate chains","Aquaporins"],a:2,e:"Carbohydrate chains on glycoproteins/glycolipids contribute to cell recognition. Cholesterol stabilizes fluidity.",w:["Cholesterol stabilizes membrane fluidity.","Tails are the hydrophobic interior of the bilayer.","","Aquaporins are water channels."]},
{t:"L3 · Tonicity",q:"Red blood cells are placed in distilled water. What happens and why?",o:["They shrink; water leaves","They stay stable; solute concentrations are equal","They swell; water enters because the solution has lower solute concentration","They shrink; solutes enter"],a:2,e:"Hypotonic solution (lower solute than the cell): water enters by osmosis and the cell swells.",w:["That is a hypertonic solution.","That is an isotonic solution.","","Osmosis involves water movement toward more solute."]},
{t:"L3 · Smooth ER",q:"Liver cells of a patient on long-term drug therapy show an expanded organelle that detoxifies drugs and synthesizes lipids. Which organelle?",o:["Rough ER","Smooth ER","Lysosome","Nucleolus"],a:1,e:"Smooth ER synthesizes lipids and participates in detoxification and calcium storage; it lacks ribosomes.",w:["Has ribosomes and makes/folds proteins.","","Digests material with hydrolytic enzymes.","Makes ribosome subunits."]},
{t:"L3 · Exocytosis",q:"A secretory vesicle from the Golgi fuses with the plasma membrane and releases its contents outside the cell. This process is:",o:["Phagocytosis","Pinocytosis","Receptor-mediated endocytosis","Exocytosis"],a:3,e:"Exocytosis releases products when intracellular vesicles fuse with the plasma membrane.",w:["Engulfs large particles into the cell.","Takes in extracellular fluid.","Brings specific molecules in.",""]},
{t:"L3 · Nucleus",q:"A cell making huge amounts of protein has a very prominent dense nuclear region. What does this region produce?",o:["Ribosome subunits","Lysosomal enzymes","Phospholipids","ATP"],a:0,e:"The nucleolus is involved in ribosome production. Ribosomes then make proteins.",w:["","Made via the ER/Golgi pathway.","Smooth ER makes lipids.","Mitochondria make most ATP."]},
{t:"L3 · Diffusion",q:"A dye placed on one side of a membrane reaches equal concentration on both sides. Which statement is correct?",o:["All molecule movement stops","Molecules still move randomly (dynamic equilibrium) with no net change","ATP is now needed to keep it balanced","The dye moved against its gradient"],a:1,e:"Diffusion continues until dynamic equilibrium; individual molecules still move but net movement is zero. Simple diffusion needs no ATP.",w:["Individual molecules keep moving.","","Simple diffusion needs no ATP.","Net movement was down the gradient."]},
{t:"L4 · Centrosome",q:"In an animal cell, which structure near the nucleus mainly organizes the assembly of microtubules?",o:["Nucleolus","Centrosome","Golgi apparatus","Lysosome"],a:1,e:"The centrosome organizes microtubule assembly; microtubules extend from it toward the cell membrane.",w:["Makes ribosome subunits.","","Processes and packages products.","Digestive organelle."]},
{t:"L4 · Fiber sizes",q:"An electron micrograph shows three cytoskeletal fibers. Which correctly orders them from widest to thinnest?",o:["Actin → intermediate → microtubule","Intermediate → microtubule → actin","Microtubule → intermediate → actin","Microtubule → actin → intermediate"],a:2,e:"Microtubules (tubulin) are widest, intermediate filaments are in between, and actin filaments are thinnest.",w:["Reversed.","Microtubules are wider than intermediate filaments.","","Actin is the thinnest, not intermediate."]},
{t:"L4 · Cilia vs flagella",q:"Which description matches a human sperm’s motility structure?",o:["Short, numerous, coordinated wave-like beating","Longer, usually single, whip-like motion that propels the cell","Actin bundle that increases surface area","Intermediate filaments that resist tension"],a:1,e:"Flagella are longer and usually few, with whip-like motion, and propel sperm. Cilia are short and numerous and move materials across surfaces. Both are microtubule-based.",w:["That describes cilia.","","That describes microvilli.","Not a motility structure."]},
{t:"L4 · Actin",q:"A white blood cell crawls toward an infection site by constantly changing shape. Which component is most directly responsible?",o:["Actin filaments","Intermediate filaments","Microtubule spindle","Cilia"],a:0,e:"Actin filaments form networks under the membrane; their rapid assembly/disassembly drives shape change, crawling and migration.",w:["","Stable; provide strength.","Used in chromosome separation.","Move materials over cell surfaces; not crawling."]},
{t:"L7 · Energy demand",q:"Which statement about exercise is most accurate?",o:["Exercise creates energy in muscle","Exercise increases ATP demand, and training can remodel systems that regenerate ATP","Exercise bypasses mitochondria","Exercise lowers ATP use"],a:1,e:"Contracting muscle consumes ATP rapidly. Repeated energetic stress can signal increased mitochondrial content and/or respiratory capacity.",w:["Energy isn’t created; ATP is regenerated.","","Mitochondria are central to ATP regeneration.","Contraction increases ATP use."]},
{t:"L7 · Signaling",q:"During repeated muscle contractions, the AMP/ATP ratio rises. What is the sequence that leads to adaptation?",o:["Energetic stress → AMPK/Ca²⁺ signaling → mitochondrial protein production → greater content and/or respiration","Mitochondrial protein production → ATP hydrolysis → signaling","Higher respiration → lower ATP demand → signaling","Signaling → contraction → ATP hydrolysis"],a:0,e:"Acute stress is the signal; repeated recovery and adaptation produce the training effect.",w:["","Order reversed; ATP hydrolysis comes first.","Adaptation follows signaling.","Contraction comes first."]},
{t:"L7 · Fuel entry",q:"After a fast, muscle oxidizes fatty acids. Which route correctly describes entry into mitochondrial energy pathways?",o:["Fatty acids → glycolysis → pyruvate","Fatty acids → β-oxidation → acetyl-CoA + NADH/FADH₂","Fatty acids → deamination → TCA intermediates","Fatty acids → directly into ATP synthase"],a:1,e:"β-oxidation yields acetyl-CoA plus NADH/FADH₂, which feed the TCA cycle and electron transport chain.",w:["Glycolysis handles glucose.","","Deamination is for amino acids.","ATP synthase uses the proton gradient, not fatty acids."]},
{t:"L7 · Generalizing",q:"A classmate says urolithin A “proves” supplements will help any patient and food will do the same. What is the best critique?",o:["The study was in highly trained male runners and tested a 1000 mg/day supplement, so don’t generalize to untrained patients or whole foods","Urolithin A is not a supplement","Runners can’t be used in studies","The trial had no placebo group"],a:0,e:"Study design matters: population, intervention and outcome limit the conclusions.",w:["","It was tested as a supplement.","They can, but results apply to that population.","It was placebo-controlled (UA or placebo)."]},
{t:"L7 · Measurements",q:"A lab wants to measure O₂ flux of muscle mitochondria with defined substrates. Which method?",o:["Citrate synthase activity","High-resolution respirometry","NIRS recovery kinetics","3000 m time trial"],a:1,e:"High-resolution respirometry asks how fast mitochondria transfer electrons/consume O₂. CS = content; NIRS = non-invasive oxidative capacity; proteomics = protein abundance.",w:["A proxy for content.","","Non-invasive estimate of capacity.","A performance measure."]},
{t:"L9 · Interstitial fluid",q:"Oxygen leaves a capillary and reaches a tissue cell. What is the correct path?",o:["Blood → interstitial fluid → cell","Blood → cell → interstitial fluid","Cell → blood → interstitial fluid","Interstitial fluid → blood → cell"],a:0,e:"Cells exchange substances with blood through interstitial fluid, which bathes the cells. CO₂ and wastes travel the reverse way.",w:["","Interstitial fluid lies between blood and the cell.","That is the direction for wastes, and it skips a step.","Wrong order."]},
{t:"L9 · Cavities & membranes",q:"Fluid builds up between the layers of the membrane around the lungs. Which membrane is involved, and which cavity?",o:["Pericardium; abdominal cavity","Peritoneum; thoracic cavity","Pleurae; thoracic cavity","Meninges; dorsal cavity"],a:2,e:"Pleurae are serous membranes of the lungs in the thoracic cavity. The diaphragm separates the thoracic and abdominal cavities.",w:["Pericardium covers the heart.","Peritoneum lines the abdominal cavity.","","Meninges protect the brain and spinal cord."]},
{t:"L1 · Characteristics of life",q:"Sara cuts her finger: she pulls her hand away, a clot forms, the area swells, and damaged tissue is replaced over days. Which pairing is best?",o:["Response to stimuli (pulling away) and homeostasis/repair (clot, wound closing)","Evolution (clot) and reproduction (swelling)","Acquiring energy (pain) and evolution (healing)","Organization (redness) and evolution (pulling away)"],a:0,e:"Withdrawing is a response to a stimulus; clotting and tissue repair restore a workable internal state (homeostasis). Evolution happens in populations, not in one patient.",w:["","Evolution acts on populations over generations.","Pain isn’t energy acquisition; healing isn’t evolution.","Evolution is not shown in one person’s reflex."]},
{t:"L1 · Controlled study",q:"In the H. pylori ulcer study (placebo 10%, antibiotic A 60%, antibiotic B 80% cured), patients were randomly assigned. What does random assignment do?",o:["Hides the treatment from the patient","Distributes differences like sex, weight and prior illness across groups","Ensures everyone gets the same dose","Proves antibiotic B works for everyone"],a:1,e:"Random assignment spreads other differences among groups. Double-blinding hides treatment; same dose/duration is the equal-conditions control; placebo is the control group.",w:["That is blinding.","","Same dose is an equal-conditions control.","One study supports, not proves, effectiveness."]},
{t:"L1 · Observations",q:"Layan has type 1 diabetes, took insulin, skipped breakfast, and becomes shaky and sweaty. Which is an objective observation?",o:["She seems anxious","Her blood glucose is 54 mg/dL","She probably forgot to eat","The morning felt stressful"],a:1,e:"Objective observations are measurable (glucose 54 mg/dL, heart rate 108). Feelings and guesses are subjective or explanations. Low glucose after insulin without food disturbed homeostasis.",w:["A judgment, subjective.","","An inference, not a measurement.","A subjective feeling."]},
{t:"L2 · Evaluating evidence",q:"A viral post says people who use a supplement are healthier. What is the best first response?",o:["Accept it because the association is positive","Reject it because all online information is unreliable","Ask how health was measured, what design was used and whether confounding was addressed","Conclude it works if the study was peer reviewed"],a:2,e:"Evidence must match the claim: directness, design, measurement, transparency, consistency. Peer review is quality control, not a guarantee of truth.",w:["Association isn’t causation.","Blanket rejection isn’t evaluation.","","Peer review can’t turn weak design into strong evidence."]},
{t:"L2 · Conflict of interest",q:"A supplement trial was funded by its manufacturer. How should you treat it?",o:["Dismiss it automatically","Accept it because disclosure proves quality","Increase scrutiny and compare with independent evidence","Ignore funding; only the journal matters"],a:2,e:"A conflict of interest is a risk to judgment, not proof of misconduct. Don’t dismiss automatically; scrutinize and compare with independent evidence.",w:["It isn’t proof of misconduct.","Disclosure is separate from study quality.","","Funding is one of the things to check."]},
{t:"L2 · Whole-person health",q:"A patient has persistent fatigue. Which approach reflects whole-person health?",o:["Treat it only as anemia until proven otherwise","Consider biological, behavioral, lifestyle, psychosocial and environmental factors that interact","Attribute it to stress","Order every test before asking about the person"],a:1,e:"Whole-person health treats the person as one connected system: biology plus behavior, lifestyle (sleep, diet), psychosocial (stress, caregiving) and environment (work hours, heat, housing).",w:["Single-cause thinking.","","Single-cause thinking.","Start with the person, not the tests."]},
{t:"L5 · Cell junctions",q:"Which junction prevents digestive material from passing between neighboring intestinal epithelial cells?",o:["Gap junction","Tight junction","Adhesion junction","Integrin"],a:1,e:"Tight junctions seal adjacent cells in a zipper-like way, so substances must cross through the cells by regulated transport.",w:["Lets ions/small molecules pass directly between cells.","","Attaches cells mechanically.","An ECM-anchoring membrane protein, not a cell–cell junction."]},
{t:"L5 · Gap junctions",q:"Heart muscle cells rapidly exchange ions to coordinate their electrical activity. Which junction allows this?",o:["Tight junctions","Adhesion junctions","Gap junctions","Basement membrane"],a:2,e:"Gap junctions are channels linking the cytoplasm of neighboring animal cells so ions and small molecules pass directly.",w:["They seal; they don’t pass ions.","They hold cells together mechanically (e.g., epidermis).","","Anchors epithelium to connective tissue."]},
{t:"L5 · ECM",q:"A tendon must resist pulling forces while the lung must stretch and recoil. Which ECM components fit?",o:["Tendon: elastin; lung: collagen","Tendon: collagen; lung: elastin","Both: fibronectin","Both: proteoglycans only"],a:1,e:"Collagen is strong and resists pulling (tendons, ligaments, skin); elastin allows stretch and recoil (lungs, skin, elastic arteries).",w:["Reversed.","","Fibronectin is an adhesive protein that binds integrins.","Proteoglycans help resist compression."]},
{t:"L5 · Insulin resistance",q:"A patient has high fasting glucose and high fasting insulin. Why might glucose stay high?",o:["The pancreas makes no insulin","Insulin is present but signaling is weak, so fewer GLUT4 transporters reach the membrane","GLUT4 is absent from all cells","Insulin enters cells and is destroyed"],a:1,e:"The signal can be present while the response is poor: receptor signaling, the IRS–PI3K–AKT relay and GLUT4 trafficking can all be altered.",w:["Insulin is high here.","","GLUT4 exists but isn’t trafficked well.","Insulin acts through its receptor via signal transduction."]},
{t:"L5 · Signaling",q:"One hormone molecule binds a receptor and triggers a huge cellular response without entering the cell. What explains this?",o:["The ligand is converted to ATP","Signal transduction with amplification through second messengers such as cAMP and Ca²⁺","The ligand diffuses to the nucleus","Receptors ingest the hormone by phagocytosis"],a:1,e:"Signal → reception → transduction → amplification → response. Second messengers (cAMP, Ca²⁺, IP₃, DAG) spread and amplify the message.",w:["Not how signals work.","","The message crosses the membrane without the ligand entering.","Not phagocytosis."]},
{t:"L6 · Feedback inhibition",q:"In the pathway A → B → C → D (enzymes E1, E2, E3), product D accumulates. How does the cell best prevent unnecessary activity?",o:["E3 is the only control point","End product D inhibits an early enzyme such as E1","D increases E1 activity","E2 is permanently removed"],a:1,e:"In feedback inhibition, the end product interacts with an enzyme early in the pathway, slowing production when enough product exists.",w:["Late control still wastes upstream material.","","That would raise D further.","Not how regulation works."]},
{t:"L6 · Enzymes",q:"Which statement about enzymes is correct?",o:["They are consumed in the reaction","They lower activation energy and change the energy of the products","They lower activation energy and are present unchanged before and after the reaction","Their active site binds any substrate"],a:2,e:"Enzymes are specific, reusable catalysts. They lower Ea but don’t change reactant or product energy levels; active-site shape gives specificity.",w:["They are reusable.","Reactant/product energy levels stay the same.","","Active sites are specific."]},
{t:"L6 · Coenzymes",q:"A diet deficient in niacin most directly affects which carrier system?",o:["NAD⁺/NADH, which transfers hydrogen and electrons","ATP synthase","Collagen","Hemoglobin"],a:0,e:"Niacin is a component of NAD⁺. NAD⁺/NADH links glycolysis and the citric acid cycle to electron transport.",w:["","Uses the proton gradient.","A structural protein.","Carries oxygen."]},
{t:"L6 · Respiration stages",q:"Which stage–location match is correct?",o:["Glycolysis: mitochondrial matrix","Citric acid cycle: cytoplasm","Electron transport: inner mitochondrial membrane (cristae)","Preparatory reaction: nucleus"],a:2,e:"Glycolysis: cytoplasm (net 2 ATP). Citric acid cycle: matrix (2 ATP, NADH, FADH₂, CO₂). Electron transport: inner membrane, producing most ATP.",w:["Glycolysis is cytoplasmic.","The cycle is in the matrix.","","It occurs in the mitochondrion."]},
{t:"L6 · Fermentation",q:"A sprinter’s muscle runs short of oxygen. What does lactate formation accomplish?",o:["More ATP from the electron transport chain","Regeneration of NAD⁺ so glycolysis can continue","Production of CO₂ and water","Activation of the citric acid cycle"],a:1,e:"Without O₂ the electron transport chain stops, but glycolysis (2 ATP) needs NAD⁺. NADH gives its electrons to pyruvate → lactate, regenerating NAD⁺.",w:["The ETC is inoperative without O₂.","","CO₂ and water come from respiration.","The cycle isn’t part of fermentation."]},
{t:"L8 · Muscle tissue",q:"A blood vessel narrows without conscious control. Its cells are spindle-shaped, with one nucleus and no striations. Which tissue?",o:["Skeletal muscle","Smooth muscle","Cardiac muscle","Neurons"],a:1,e:"Smooth muscle: involuntary, spindle-shaped, one nucleus, no striations, in organ and vessel walls.",w:["Voluntary, striated, many nuclei.","","Branched, striated, intercalated discs.","Nervous tissue."]},
{t:"L8 · Connective tissue",q:"Which tissue provides a flexible surface at a bone end and heals slowly because it lacks a direct blood supply?",o:["Dense fibrous tissue (tendon)","Cartilage","Adipose tissue","Skeletal muscle"],a:1,e:"Cartilage heals slowly because it lacks a direct blood supply. Tendons connect muscle to bone; adipose stores energy and cushions.",w:["Connects muscle to bone with dense collagen.","","Stores energy and cushions.","A muscle tissue."]},
{t:"L8 · Epithelium",q:"As the bladder fills, which epithelium changes shape to allow stretching?",o:["Simple squamous","Simple cuboidal","Ciliated columnar","Transitional"],a:3,e:"Transitional epithelium lines the bladder and stretches. Thin simple squamous suits lung air sacs for exchange.",w:["Thin, for exchange.","For secretion/absorption.","Moves mucus and particles.",""]},
{t:"L8 · Glands",q:"A gland releases hormones directly into interstitial fluid and then blood, with no duct. Which type?",o:["Exocrine","Endocrine","Sweat gland","Salivary gland"],a:1,e:"Endocrine glands (pituitary, thyroid) have no ducts. Exocrine glands (sweat, salivary, mammary) secrete through ducts.",w:["Uses ducts.","","Exocrine.","Exocrine."]},
{t:"L10 · Blood vessels",q:"Which vessel has a single endothelial layer, giving a short diffusion path to tissue cells?",o:["Artery","Capillary","Vein","Arteriole"],a:1,e:"Capillaries are the exchange surface. Arteries have thick elastic walls; veins have thinner walls and valves.",w:["Thick, elastic wall.","","Thinner walls with valves.","Smooth muscle regulates flow."]},
{t:"L10 · Red blood cells",q:"A person has too little hemoglobin. What is the effect, and why can’t normal plasma volume compensate?",o:["Less O₂ is delivered; hemoglobin binds oxygen and plasma carries little on its own","More O₂ is delivered","Only CO₂ transport is affected","No effect, because plasma carries oxygen"],a:0,e:"Hemoglobin binds oxygen in the lungs and releases it in tissues. Low hemoglobin reduces delivery. The kidneys release EPO when delivery is insufficient; iron, B12 and folate support red-cell production.",w:["","Less hemoglobin means less delivery.","Oxygen delivery is the main problem.","Plasma carries only a small amount of O₂."]},
{t:"L10 · Clotting",q:"Which sequence is correct after a vessel injury?",o:["Fibrin network → platelet plug → thrombin → injury","Injury → platelet plug → thrombin formation → fibrin network","Injury → fibrin → platelet plug → thrombin","Thrombin → injury → fibrin → plug"],a:1,e:"Platelets (megakaryocyte fragments) form a plug; clotting reactions produce thrombin, which converts fibrinogen into fibrin to reinforce the plug.",w:["Fibrin forms last.","","Fibrin follows thrombin.","Injury starts the process."]},
{t:"L10 · White blood cells",q:"Which pair is correct: an early phagocyte at an infection, and the cell type monocytes become?",o:["Neutrophil; macrophage","Eosinophil; neutrophil","Basophil; lymphocyte","Lymphocyte; macrophage"],a:0,e:"Neutrophils phagocytose; monocytes become macrophages. Eosinophils: worms; basophils: histamine/inflammation; lymphocytes: specific immunity.",w:["","Eosinophils defend against worms.","Basophils release histamine.","Lymphocytes aren’t phagocytes."]},
{t:"L11 · Heart structure",q:"Why is the left ventricular wall thicker than the right?",o:["It pumps blood to the lungs","It pumps blood to the whole body through the systemic circuit","It receives blood from the venae cavae","It contains the SA node"],a:1,e:"Chambers match their workload: the left ventricle pumps to the body (thick wall); the right ventricle pumps to the lungs.",w:["That’s the right ventricle.","","The right atrium receives it.","Not the reason."]},
{t:"L11 · Conduction",q:"Which sequence is correct, and what does the AV nodal delay allow?",o:["AV node → SA node → ventricles; ventricular filling","SA node → AV node (brief delay) → conducting fibers → ventricles; time for ventricular filling","SA node → ventricles → AV node","AV node → atria; blocks filling"],a:1,e:"The SA node starts the signal; the AV node briefly delays it so ventricles can fill; conducting fibers then activate the ventricles.",w:["The SA node starts it.","","The AV node comes before the ventricles.","The delay helps filling."]},
{t:"L11 · Circuits",q:"Which route is correct for blood leaving the right ventricle?",o:["Aorta → body → right atrium","Pulmonary trunk → lung capillaries → pulmonary veins → left atrium","Pulmonary veins → right atrium","Vena cava → left ventricle"],a:1,e:"Pulmonary circuit: right ventricle → pulmonary trunk/arteries → lung capillaries (CO₂ out, O₂ in) → pulmonary veins → left atrium.",w:["That is the systemic route from the left ventricle.","","Wrong direction.","Wrong direction."]},
{t:"L11 · Heart sounds",q:"A doctor hears the “lub.” Which valves just closed?",o:["Semilunar valves","AV valves (tricuspid and mitral)","Only the aortic valve","Pulmonary veins"],a:1,e:"“Lub” = AV valves close; “dub” = semilunar valves close. A leaking valve allows backward flow.",w:["That’s the “dub.”","","The aortic valve is semilunar and closes with the “dub.”","Veins aren’t heart valves."]},
{t:"L12 · Lymph and lipids",q:"After a high-fat meal, lymph from the gut looks creamy. Why?",o:["Lymphatic capillaries absorb dietary fats and carry them toward the blood","Fat enters blood capillaries directly","The thoracic duct produces fat","Lymph nodes store fat"],a:0,e:"Absorbed lipids enter lymph before blood; the thoracic duct empties near the left subclavian vein.",w:["","Fats enter lymph first.","Ducts only carry lymph.","Nodes filter lymph."]},
{t:"L12 · Lymph flow",q:"During a long flight a student’s ankles swell. Which lymph-return mechanism is reduced?",o:["Heart pumping lymph","Skeletal muscle contraction compressing vessels, with one-way valves","Arterial pressure","Antibodies"],a:1,e:"Lymph has no central pump; muscle contraction and valves push it forward. Poor movement slows return and contributes to edema.",w:["Lymph has no central pump.","","Not the mechanism.","Unrelated."]},
{t:"L12 · Lymphoid organs",q:"Which pair contains the primary lymphatic organs?",o:["Spleen and lymph nodes","Tonsils and spleen","Red bone marrow and thymus","Lymph nodes and thymus"],a:2,e:"Primary: red bone marrow (B-cell maturation) and thymus (T cells). Secondary: nodes filter lymph, spleen filters blood, tonsils guard entry routes.",w:["Both secondary.","Both secondary.","","Nodes are secondary."]},
{t:"L12 · Immune memory",q:"Months after a first infection, re-exposure to the same pathogen causes only mild symptoms. Which feature best explains this?",o:["Skin barriers","Memory B and T cells producing a faster, larger response","Complement lysing bacteria","Neutrophils arriving early"],a:1,e:"Adaptive immunity leaves memory cells that respond faster and stronger. Innate immunity has no antigen-specific memory.",w:["Innate, not memory-based.","","Innate.","Innate, no memory."]},
{t:"L12 · Adaptive response",q:"A macrophage displays viral antigen in a lymph node. Which sequence leads to both antibodies and killing of infected cells?",o:["The macrophage releases antibodies that kill infected cells","It activates a helper T cell, which supports B-cell (plasma cell/antibody) and cytotoxic T-cell (apoptosis) responses","Memory B cells destroy infected cells alone","Virus enters B cells, which present antigen to epithelium"],a:1,e:"Antigen presentation activates helper T cells, which coordinate the B-cell branch (plasma cells, memory B cells) and the cytotoxic T-cell branch (apoptosis of infected cells, memory T cells).",w:["Macrophages don’t make antibodies.","","Memory cells don’t act alone.","Not the pathway."]}
];
const KEEP=[40,41,43,45,0,1,2,4,6,8,9,11,12,46,47,49,51,52,54,55,13,14,16,17,56,57,58,19,20,21,39,60,61,62,64,65,66,70,71,72];const Q=ALL.filter((_,i)=>KEEP.includes(i));
const app=document.getElementById("app");let order=[],pos=0,picked=null,ans={},flags=new Set(),perm={};
try{const s=JSON.parse(localStorage.getItem("bq2")||"{}");flags=new Set(s.fl||[])}catch(e){}
function save(){try{localStorage.setItem("bq2",JSON.stringify({fl:[...flags]}))}catch(e){}}
function sh(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function run(list){order=list;pos=0;list.forEach(i=>perm[i]=sh([0,1,2,3]));render()}
function intro(){app.innerHTML=`<div class="card"><h2>Ready?</h2><p>${Q.length} scenario questions. Green = right, red = wrong, with the reason. Flag anything you want to re-check; missed questions come back at the end.</p><div class="col"><button class="pri" id="go">Start quiz</button>${flags.size?`<button class="ghost" id="rf">⚑ Review flagged (${flags.size})</button>`:""}</div></div>`;
document.getElementById("go").onclick=()=>{ans={};run(sh(Q.map((_,i)=>i)))};const r=document.getElementById("rf");if(r)r.onclick=()=>run([...flags])}
function render(){const i=order[pos],q=Q[i];picked=null;
app.innerHTML=`<div class="bar"><i style="width:${pos/order.length*100}%"></i></div><div class="meta"><span>Question ${pos+1} of ${order.length}</span><span class="tag">${q.t}</span></div><div class="card"><p class="q">${q.q}</p>${perm[i].map((k,n)=>`<button class="opt" data-k="${k}"><b>${"ABCD"[n]}</b><span>${q.o[k]}</span></button>`).join("")}<div id="fb"></div></div><div class="row"><button class="ghost" id="fl"></button><button class="pri" id="nx" hidden></button></div>`;
const fl=document.getElementById("fl");const upd=()=>{fl.className="ghost"+(flags.has(i)?" on":"");fl.textContent=flags.has(i)?"⚑ Flagged":"⚐ Flag for review"};upd();
fl.onclick=()=>{flags.has(i)?flags.delete(i):flags.add(i);save();upd()};
app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.k))}
function pick(k){if(picked!==null)return;picked=k;const i=order[pos],q=Q[i],ok=k===q.a;ans[i]=ok;
app.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(+b.dataset.k===q.a)b.classList.add("ok");else if(+b.dataset.k===k)b.classList.add("no")});
document.getElementById("fb").innerHTML=ok?`<div class="ex ok"><h4>✅ Correct</h4><p>${q.e}</p></div>`:`<div class="ex no"><h4>❌ Not quite. You chose “${q.o[k]}”</h4><p>${q.w[k]}</p></div><div class="ex ok"><h4>✅ Correct: ${q.o[q.a]}</h4><p>${q.e}</p></div>`;
const nx=document.getElementById("nx");nx.hidden=false;nx.textContent=pos===order.length-1?"See results":"Next →";nx.onclick=()=>{pos++;pos>=order.length?done():render()};nx.scrollIntoView({behavior:"smooth",block:"nearest"})}
function done(){const c=order.filter(i=>ans[i]).length,miss=Object.keys(ans).filter(i=>ans[i]===false).map(Number),fl=[...flags];
app.innerHTML=`<div class="card"><div class="big">${c}/${order.length}</div><p style="text-align:center">${miss.length?"Let’s fix the ones you missed 💪":"Perfect round! 🎉"}</p><div class="col">${miss.length?`<button class="pri" id="rm">🔁 Redo missed (${miss.length})</button>`:""}${fl.length?`<button class="ghost" id="rf">⚑ Review flagged (${fl.length})</button>`:""}<button class="ghost" id="rs">Restart everything</button></div></div>`;
const g=id=>document.getElementById(id);if(g("rm"))g("rm").onclick=()=>run(sh(miss));if(g("rf"))g("rf").onclick=()=>run(fl);g("rs").onclick=intro}
intro();
</script></body></html>
